plugins {
    id "com.android.application"
}

android {
    namespace "idol.aurora.app"
    compileSdk 35

    signingConfigs {
        release {
            storeFile file("../aurora-idol.keystore")
            storePassword "auroraidol"
            keyAlias "aurora"
            keyPassword "auroraidol"
        }
    }

    defaultConfig {
        applicationId "idol.aurora.app"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.0.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
